default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
      - id: format-check
        name: format check
        entry: npm run format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test
        entry: npm run test
        language: system
        pass_filenames: false
        always_run: true
